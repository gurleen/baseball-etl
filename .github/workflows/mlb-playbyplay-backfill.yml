name: Backfill MLB play-by-play

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to backfill, e.g. 2026. Defaults to the current calendar year."
        required: false
        type: string
      game_types:
        description: >-
          MLB game type code(s), e.g. "R" for regular season or "F,D,L,W" for
          postseason rounds.
        required: false
        type: string
        default: "R"
      database_url:
        description: >-
          Postgres URL to load into. Optional — defaults to the DATABASE_URL
          repo secret. NOTE: unlike a secret, a value typed here is visible in
          plain text in this run's Actions UI, so prefer leaving it blank and
          using the secret unless you specifically need to target a different
          database for this run.
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Backfill play-by-play data through yesterday
        env:
          DATABASE_URL: ${{ github.event.inputs.database_url || secrets.DATABASE_URL }}
          SEASON: ${{ github.event.inputs.season }}
          GAME_TYPES: ${{ github.event.inputs.game_types || 'R' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No database_url input and no DATABASE_URL secret set." >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          end_date="$(date -u -d 'yesterday' +%F)"
          args=(mlb-playbyplay --game-types "$GAME_TYPES" --end-date "$end_date")
          if [ -n "$SEASON" ]; then
            args+=(--season "$SEASON")
          fi
          echo "Backfilling through $end_date"
          uv run main.py "${args[@]}"
