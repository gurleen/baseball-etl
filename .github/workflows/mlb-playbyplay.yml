name: Load MLB play-by-play

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to load, e.g. 2026. Defaults to the current calendar year."
        required: false
        type: string
      game_types:
        description: >-
          MLB game type code(s), e.g. "R" for regular season or "F,D,L,W" for
          postseason rounds.
        required: false
        type: string
        default: "R"
      start_date:
        description: >-
          Only load games on/after this date (YYYY-MM-DD). Optional —
          defaults to 7 days before today.
        required: false
        type: string
      end_date:
        description: "Only load games on/before this date (YYYY-MM-DD). Optional."
        required: false
        type: string
      database_url:
        description: >-
          Postgres URL to load into. Optional — defaults to the DATABASE_URL
          repo secret. NOTE: unlike a secret, a value typed here is visible in
          plain text in this run's Actions UI, so prefer leaving it blank and
          using the secret unless you specifically need to target a different
          database for this run.
        required: false
        type: string
  schedule:
    # Daily during the MLB season. Re-fetches a trailing 7-day window (see
    # START_DATE default below) rather than the whole season, since a merge
    # write disposition makes re-pulling those days idempotent while still
    # catching late score/status corrections.
    - cron: "0 12 * 3-11 *"

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Load play-by-play data
        env:
          DATABASE_URL: ${{ github.event.inputs.database_url || secrets.DATABASE_URL }}
          SEASON: ${{ github.event.inputs.season }}
          GAME_TYPES: ${{ github.event.inputs.game_types || 'R' }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No database_url input and no DATABASE_URL secret set." >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          if [ -z "$START_DATE" ]; then
            START_DATE="$(date -u -d '7 days ago' +%F)"
          fi
          args=(mlb-playbyplay --game-types "$GAME_TYPES" --start-date "$START_DATE")
          if [ -n "$SEASON" ]; then
            args+=(--season "$SEASON")
          fi
          if [ -n "$END_DATE" ]; then
            args+=(--end-date "$END_DATE")
          fi
          echo "Loading play-by-play data from $START_DATE"
          uv run main.py "${args[@]}"

      - name: Run SQLMesh models
        env:
          DATABASE_URL: ${{ github.event.inputs.database_url || secrets.DATABASE_URL }}
        run: |
          echo "::add-mask::$DATABASE_URL"
          uv run sqlmesh --paths transform run
