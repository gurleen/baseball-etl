name: Load MLB sports

on:
  workflow_dispatch:
    inputs:
      database_url:
        description: >-
          Postgres URL to load into. Optional — defaults to the DATABASE_URL
          repo secret. NOTE: unlike a secret, a value typed here is visible in
          plain text in this run's Actions UI, so prefer leaving it blank and
          using the secret unless you specifically need to target a different
          database for this run.
        required: false
        type: string
  # Disabled: scheduling moved to the "mlb-sports" Prefect deployment
  # (see prefect.yaml). Kept here, workflow_dispatch-only, as a manual
  # fallback.
  # schedule:
  #   # The sport list (MLB, AAA, AA, etc.) essentially never changes.
  #   - cron: "0 12 1 1 *"

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Load sports data
        env:
          DATABASE_URL: ${{ github.event.inputs.database_url || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No database_url input and no DATABASE_URL secret set." >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          uv run main.py mlb-sports
